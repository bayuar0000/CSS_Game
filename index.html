<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Challenge XI RPL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-top: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1, h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0 15px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    margin: 5px;
    font-size: 15px;
    cursor: pointer;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-secondary {
    background: #64748b;
    color: white;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.hidden {
    display: none;
}

.progress {
    width: 100%;
    height: 12px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin: 15px 0;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width 0.3s;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    margin: 10px 0;
}

.option:hover {
    background: #eff6ff;
    border-color: #93c5fd;
}

.option.selected {
    background: #dbeafe;
    border-color: #2563eb;
}

.feedback {
    padding: 12px;
    border-radius: 10px;
    margin-top: 15px;
}

.feedback.correct {
    background: #dcfce7;
    color: #166534;
}

.feedback.wrong {
    background: #fee2e2;
    color: #991b1b;
}

.code-box {
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 15px 0;
    white-space: pre-wrap;
}

.result-score {
    font-size: 50px;
    font-weight: bold;
    text-align: center;
    color: #2563eb;
}

.review-item {
    border-bottom: 1px solid #e2e8f0;
    padding: 12px 0;
}

.correct-text {
    color: #16a34a;
    font-weight: bold;
}

.wrong-text {
    color: #dc2626;
    font-weight: bold;
}

.small {
    color: #64748b;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HALAMAN AWAL -->
    <div id="start" class="card">
        <h1>🎨 CSS Challenge XI RPL</h1>

        <p>
            Uji kemampuanmu menerapkan dasar-dasar CSS.
            Terdapat <b>15 tantangan</b> dengan skor maksimal
            <b>100 poin</b>.
        </p>

        <label for="name"><b>Nama Siswa</b></label>

        <input
            type="text"
            id="name"
            placeholder="Masukkan nama lengkap"
        >

        <button
            class="btn-primary"
            id="startBtn"
        >
            Mulai Tantangan
        </button>

        <div class="footer">
            Dasar-Dasar CSS • Kelas XI RPL
        </div>
    </div>


    <!-- HALAMAN GAME -->
    <div id="game" class="card hidden">

        <p>
            Peserta:
            <b id="playerName"></b>
        </p>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>

        <div>
            <b id="counter"></b>
            <span> • </span>
            <span id="points"></span>
        </div>

        <hr>

        <div id="challenge"></div>

        <div
            id="feedback"
            class="feedback hidden"
        ></div>

        <div style="margin-top:20px;">
            <button
                id="prevBtn"
                class="btn-secondary"
            >
                ← Sebelumnya
            </button>

            <button
                id="nextBtn"
                class="btn-primary"
            >
                Lanjut →
            </button>
        </div>

        <p class="small">
            Skor sementara:
            <b id="liveScore">0</b>
        </p>

    </div>


    <!-- HALAMAN HASIL -->
    <div id="result" class="card hidden">

        <h2>🎉 Tantangan Selesai!</h2>

        <p id="resultName"></p>

        <div
            id="finalScore"
            class="result-score"
        >
            0
        </div>

        <p id="resultMessage"></p>

        <hr>

        <h3>Review Jawaban</h3>

        <div id="review"></div>

        <button
            id="restartBtn"
            class="btn-primary"
        >
            🔄 Main Lagi
        </button>

        <div
            id="saveStatus"
            class="feedback"
        >
            Menyimpan hasil...
        </div>

    </div>

</div>


<script>

/* =====================================================
   PENGATURAN GOOGLE APPS SCRIPT
   ===================================================== */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwvFYmRUD7focRpfqty7v6KfBvIszvkjKmtZz-ZvyOhdb9CZ0vIkRceO-ClkgXYc8Z3/exec";


/* =====================================================
   DATA 15 TANTANGAN
   ===================================================== */

const challenges = [

    {
        q: "CSS digunakan terutama untuk apa?",
        opts: [
            "Membuat struktur halaman",
            "Mengatur tampilan halaman",
            "Membuat database",
            "Menyimpan file"
        ],
        a: 1,
        exp: "CSS digunakan untuk mengatur tampilan dan gaya halaman HTML."
    },

    {
        q: "Sintaks CSS yang benar adalah...",
        opts: [
            "selector { property: value; }",
            "selector = property : value",
            "<selector> property=value",
            "css(selector, property, value)"
        ],
        a: 0,
        exp: "Sintaks dasar CSS adalah selector { property: value; }."
    },

    {
        q: "Properti CSS untuk mengubah warna teks adalah...",
        opts: [
            "background",
            "font-size",
            "color",
            "text-style"
        ],
        a: 2,
        exp: "Properti color digunakan untuk mengatur warna teks."
    },

    {
        q: "Properti untuk mengubah ukuran teks adalah...",
        opts: [
            "font-size",
            "text-color",
            "size-font",
            "font-color"
        ],
        a: 0,
        exp: "font-size digunakan untuk mengatur ukuran teks."
    },

    {
        q: "CSS eksternal biasanya dihubungkan dengan elemen...",
        opts: [
            "<style>",
            "<css>",
            "<link>",
            "<script>"
        ],
        a: 2,
        exp: "File CSS eksternal dihubungkan menggunakan elemen link."
    },

    {
        q: "Selector .siswa digunakan untuk memilih...",
        opts: [
            "ID siswa",
            "Class siswa",
            "Tag siswa",
            "File siswa"
        ],
        a: 1,
        exp: "Tanda titik (.) digunakan untuk memilih class."
    },

    {
        q: "Selector #judul digunakan untuk memilih...",
        opts: [
            "Class judul",
            "Tag judul",
            "ID judul",
            "File judul"
        ],
        a: 2,
        exp: "Tanda # digunakan untuk memilih ID."
    },

    {
        q: "Properti yang tepat untuk memberi jarak DI DALAM elemen adalah...",
        opts: [
            "margin",
            "padding",
            "border",
            "display"
        ],
        a: 1,
        exp: "Padding adalah jarak antara isi elemen dan border."
    },

    {
        q: "Properti yang tepat untuk memberi jarak DI LUAR elemen adalah...",
        opts: [
            "padding",
            "margin",
            "border",
            "content"
        ],
        a: 1,
        exp: "Margin adalah jarak di luar border elemen."
    },

    {
        q: "Manakah yang membuat sudut kotak menjadi membulat?",
        opts: [
            "border-radius",
            "box-radius",
            "corner",
            "radius-border"
        ],
        a: 0,
        exp: "border-radius digunakan untuk membuat sudut membulat."
    },

    {
        q: "Perhatikan kode berikut:\n\n.button { color: red; }\n\nSelector tersebut adalah...",
        code: ".button {\n    color: red;\n}",
        opts: [
            "Element selector",
            "Class selector",
            "ID selector",
            "Universal selector"
        ],
        a: 1,
        exp: "Selector .button merupakan class selector."
    },

    {
        q: "Perhatikan kode berikut:\n\n#header { background: blue; }\n\nApa fungsi #header?",
        code: "#header {\n    background: blue;\n}",
        opts: [
            "Memilih class header",
            "Memilih tag header",
            "Memilih ID header",
            "Membuat file header"
        ],
        a: 2,
        exp: "Selector dengan tanda # memilih elemen berdasarkan ID."
    },

    {
        q: "Kamu ingin membuat tombol dengan latar belakang biru. CSS yang tepat adalah...",
        code: ".btn {\n    background-color: blue;\n}",
        opts: [
            "Mengubah warna latar tombol",
            "Mengubah ukuran tombol",
            "Menghapus tombol",
            "Mengubah teks menjadi biru"
        ],
        a: 0,
        exp: "background-color digunakan untuk mengatur warna latar belakang."
    },

    {
        q: "Kamu membuat kartu profil siswa. Kombinasi CSS yang paling masuk akal adalah...",
        opts: [
            "padding, border, border-radius",
            "margin saja",
            "color saja",
            "font-size saja"
        ],
        a: 0,
        exp: "Padding memberi ruang dalam, border memberi batas, dan border-radius membuat sudut membulat."
    },

    {
        q: "Urutan Box Model CSS dari bagian paling dalam ke luar adalah...",
        opts: [
            "Margin → Border → Padding → Content",
            "Content → Padding → Border → Margin",
            "Border → Content → Margin → Padding",
            "Padding → Content → Border → Margin"
        ],
        a: 1,
        exp: "Urutan Box Model adalah Content → Padding → Border → Margin."
    }

];


/* =====================================================
   BOBOT NILAI
   10 soal × 7 poin = 70
   5 soal × 6 poin = 30
   TOTAL = 100
   ===================================================== */

const weights = challenges.map(
    (_, i) => i < 10 ? 7 : 6
);


/* =====================================================
   VARIABEL GAME
   ===================================================== */

let player = "";
let current = 0;

let answers = Array(
    challenges.length
).fill(null);

let finished = false;


/* =====================================================
   FUNGSI BANTUAN
   ===================================================== */

function $(id) {
    return document.getElementById(id);
}


/* =====================================================
   MULAI GAME
   ===================================================== */

$("startBtn").addEventListener(
    "click",
    startGame
);

function startGame() {

    const name =
        $("name").value.trim();

    if (!name) {
        alert(
            "Masukkan nama terlebih dahulu."
        );
        return;
    }

    player = name;
    current = 0;

    answers.fill(null);

    finished = false;

    $("start").classList.add(
        "hidden"
    );

    $("game").classList.remove(
        "hidden"
    );

    $("playerName").textContent =
        player;

    render();
}


/* =====================================================
   MENAMPILKAN SOAL
   ===================================================== */

function render() {

    const c =
        challenges[current];

    $("counter").textContent =
        `Tantangan ${current + 1} dari ${challenges.length}`;

    $("points").textContent =
        `${weights[current]} poin`;

    $("progressBar").style.width =
        `${((current + 1) / challenges.length) * 100}%`;

    $("liveScore").textContent =
        score();

    $("prevBtn").disabled =
        current === 0;

    $("nextBtn").textContent =
        current === challenges.length - 1
            ? "Lihat Hasil"
            : "Lanjut →";


    let html = "";

    html += `
        <h2>${escapeHtml(c.q)}</h2>
    `;


    if (c.code) {

        html += `
            <div class="code-box">${escapeHtml(c.code)}</div>
        `;

    }


    html += `
        <div>
    `;


    c.opts.forEach(
        (option, index) => {

            const selected =
                answers[current] === index
                    ? "selected"
                    : "";

            html += `
                <button
                    class="option ${selected}"
                    data-index="${index}"
                >
                    ${String.fromCharCode(65 + index)}.
                    ${escapeHtml(option)}
                </button>
            `;
        }
    );


    html += `
        </div>
    `;


    $("challenge").innerHTML =
        html;


    $("feedback").className =
        "feedback hidden";


    document
        .querySelectorAll(".option")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        Number(
                            button.dataset.index
                        )
                    );

                }
            );

        });
}


/* =====================================================
   MEMILIH JAWABAN
   ===================================================== */

function selectAnswer(index) {

    answers[current] =
        index;

    render();
}


/* =====================================================
   TOMBOL SEBELUMNYA
   ===================================================== */

$("prevBtn").addEventListener(
    "click",
    () => {

        if (current > 0) {

            current--;

            render();
        }

    }
);


/* =====================================================
   TOMBOL BERIKUTNYA
   ===================================================== */

$("nextBtn").addEventListener(
    "click",
    next
);

function next() {

    if (answers[current] === null) {

        $("feedback").className =
            "feedback wrong";

        $("feedback").textContent =
            "Pilih salah satu jawaban terlebih dahulu.";

        return;
    }


    if (
        current <
        challenges.length - 1
    ) {

        current++;

        render();

    } else {

        finish();

    }
}


/* =====================================================
   HITUNG SKOR
   ===================================================== */

function score() {

    return answers.reduce(
        (total, answer, i) => {

            if (
                answer ===
                challenges[i].a
            ) {

                return total +
                    weights[i];

            }

            return total;

        },
        0
    );
}


/* =====================================================
   SELESAIKAN GAME
   ===================================================== */

function finish() {

    finished = true;

    $("game").classList.add(
        "hidden"
    );

    $("result").classList.remove(
        "hidden"
    );


    const finalScore =
        score();


    $("finalScore").textContent =
        finalScore;


    $("resultName").textContent =
        `Nama: ${player}`;


    let message = "";

    if (finalScore >= 90) {

        message =
            "Luar biasa! Kamu sangat baik dalam menerapkan CSS.";

    } else if (finalScore >= 75) {

        message =
            "Bagus! Terus latih penerapan CSS.";

    } else if (finalScore >= 60) {

        message =
            "Cukup baik. Tinjau kembali selector dan Box Model.";

    } else {

        message =
            "Tetap semangat. Pelajari kembali materi CSS lalu coba lagi.";

    }


    $("resultMessage").textContent =
        message;


    let rows = "";


    answers.forEach(
        (answer, i) => {

            const correct =
                answer ===
                challenges[i].a;


            rows += `
                <div class="review-item">

                    <b>
                        ${i + 1}.
                        ${escapeHtml(
                            challenges[i].q
                        )}
                    </b>

                    <br>

                    <span class="${
                        correct
                            ? "correct-text"
                            : "wrong-text"
                    }">

                        ${
                            correct
                                ? "✓ Benar"
                                : "✗ Salah"
                        }

                    </span>

                    <br>

                    <span class="small">

                        Jawaban benar:
                        ${String.fromCharCode(
                            65 + challenges[i].a
                        )}.
                        ${escapeHtml(
                            challenges[i].opts[
                                challenges[i].a
                            ]
                        )}

                    </span>

                </div>
            `;

        }
    );


    $("review").innerHTML =
        rows;


    saveToSheet(finalScore);
}


/* =====================================================
   KIRIM HASIL KE GOOGLE SHEETS
   ===================================================== */

function saveToSheet(finalScore) {

    const status =
        $("saveStatus");


    if (
        !GOOGLE_SCRIPT_URL ||
        GOOGLE_SCRIPT_URL.includes(
            "PASTE_URL"
        )
    ) {

        status.className =
            "feedback wrong";

        status.innerHTML =
            "<b>Mode demo:</b> hasil belum dikirim ke Google Sheets. " +
            "Guru perlu memasukkan URL Web Apps Script pada kode.";

        return;
    }


    const payload = {

        nama: player,

        skor: finalScore,

        waktu:
            new Date().toISOString(),

        jawaban:
            answers.map(
                (answer, i) =>
                    answer ===
                    challenges[i].a
                        ? "Benar"
                        : "Salah"
            ).join(", ")

    };


    fetch(
        GOOGLE_SCRIPT_URL,
        {
            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                    "text/plain;charset=utf-8"
            },

            body:
                JSON.stringify(payload)

        }
    )
    .then(() => {

        status.className =
            "feedback correct";

        status.textContent =
            "✓ Hasil berhasil dikirim ke Google Sheets.";

    })
    .catch(error => {

        console.error(error);

        status.className =
            "feedback wrong";

        status.textContent =
            "Hasil game selesai, tetapi pengiriman ke Google Sheets gagal. " +
            "Periksa URL Apps Script.";

    });
}


/* =====================================================
   MAIN LAGI
   ===================================================== */

$("restartBtn").addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* =====================================================
   PENGAMAN HTML
   ===================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
